<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>Race Control</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#000000; --surface:#0D0D0D; --border:#1E1E1E;
  --text:#FFFFFF; --sub:#888888;
  --active:#FF3300; --active-bg:#1A0000;
  --next:#4488FF;   --next-bg:#000D1A;
  --race:#FF3300; --session:#4488FF; --marshal:#44CC44; --procedure:#DDAA00;
  --font:'Barlow Condensed',sans-serif;
  --mono:'Share Tech Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;transition:background .3s,color .3s}
#app{display:flex;flex-direction:column;height:100%;max-width:600px;margin:0 auto;width:100%}

/* CLOCK */
.clock-section{padding:14px 20px 10px;background:var(--surface);border-bottom:2px solid var(--border);flex-shrink:0}
#clockTime{font-family:var(--mono);font-size:clamp(52px,13vw,80px);line-height:1;letter-spacing:-1px;color:var(--text)}
#clockTime.test-mode{color:var(--next)}
#clockSub{font-size:clamp(12px,3vw,16px);font-weight:700;letter-spacing:2px;color:var(--sub);text-transform:uppercase;margin-top:2px}

/* CURRENT */
.current-section{padding:12px 20px 10px;border-bottom:2px solid var(--border);flex-shrink:0;background:var(--surface);border-left:6px solid transparent;transition:background .2s,border-color .2s}
.current-section.active{background:var(--active-bg);border-left-color:var(--active)}
.current-section.next-only{background:var(--next-bg);border-left-color:var(--next)}
.section-label{font-size:10px;font-weight:800;letter-spacing:3px;color:var(--sub);text-transform:uppercase;margin-bottom:3px}
.current-section.active .section-label{color:var(--active)}
.current-section.next-only .section-label{color:var(--next)}
#currentEventName{font-size:clamp(24px,7vw,40px);font-weight:900;line-height:1.1;color:var(--text)}
.current-section.active #currentEventName{color:var(--active)}
.current-section.next-only #currentEventName{color:var(--next)}
#currentEventDetail{font-size:clamp(14px,4vw,18px);font-weight:600;color:var(--sub);margin-top:2px}

/* COUNTDOWN */
.countdown-section{padding:14px 20px;border-bottom:3px solid var(--border);flex-shrink:0;background:var(--surface);text-align:center}
#countdownLabel{font-size:10px;font-weight:800;letter-spacing:3px;color:var(--sub);text-transform:uppercase;margin-bottom:0}
#countdownTime{font-family:var(--mono);font-size:clamp(60px,20vw,104px);line-height:1;letter-spacing:-2px;color:var(--text)}
#countdownTime.running{color:var(--active)}
#countdownTime.waiting{color:var(--next)}
#countdownCtx{font-size:clamp(12px,3.5vw,16px);font-weight:700;color:var(--sub);letter-spacing:1px;margin-top:2px;text-transform:uppercase}

/* SCHEDULE */
.schedule-section{flex:1;min-height:0;display:flex;flex-direction:column}
.schedule-header{display:flex;align-items:center;gap:10px;padding:8px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.schedule-title{font-size:10px;font-weight:800;letter-spacing:3px;color:var(--sub);text-transform:uppercase;flex:1}
#scheduleCount{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:1px}
.load-btn{cursor:pointer;font-size:13px;font-weight:800;letter-spacing:1px;color:var(--text);background:var(--bg);border:1.5px solid var(--border);padding:5px 12px;border-radius:4px;user-select:none;font-family:var(--font);transition:background .15s}
.load-btn:active{background:var(--border)}
#scheduleBody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 0 24px}
.empty-msg{padding:40px 20px;text-align:center;font-size:16px;font-weight:700;color:var(--sub);letter-spacing:1px}
.day-header{display:flex;align-items:center;gap:10px;padding:10px 20px 5px;position:sticky;top:0;background:var(--bg);z-index:2}
.day-name{font-size:10px;font-weight:800;letter-spacing:3px;color:var(--sub);text-transform:uppercase}
.day-date{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--sub)}
.day-line{flex:1;height:1px;background:var(--border)}
.sched-item{display:flex;align-items:center;gap:12px;padding:11px 20px;border-bottom:1px solid var(--border);border-left:5px solid transparent;transition:background .15s}
.sched-item.is-current{background:var(--active-bg);border-left-color:var(--active)}
.sched-item.is-next{background:var(--next-bg);border-left-color:var(--next)}
.sched-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:var(--sub)}
.sched-item.t-race .sched-dot{background:var(--race)}
.sched-item.t-session .sched-dot{background:var(--session)}
.sched-item.t-marshal .sched-dot{background:var(--marshal)}
.sched-item.t-procedure .sched-dot{background:var(--procedure);border-radius:2px}
.sched-item.is-current .sched-dot{background:var(--active)}
.sched-item.is-next .sched-dot{background:var(--next)}
.sched-time{font-family:var(--mono);font-size:clamp(16px,5vw,21px);color:var(--sub);flex-shrink:0;min-width:54px}
.sched-item.is-current .sched-time{color:var(--active);font-weight:700}
.sched-item.is-next .sched-time{color:var(--next)}
.sched-name{font-size:clamp(18px,5vw,24px);font-weight:800;color:var(--text);flex:1;line-height:1.1}
.sched-item.is-current .sched-name{color:var(--active)}
.sched-item.is-next .sched-name{color:var(--next)}
.sched-cat{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--sub);text-transform:uppercase;flex-shrink:0}

/* CONTROLS */
.top-bar{position:fixed;top:6px;right:8px;display:flex;gap:6px;z-index:100}
.icon-btn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.test-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:3px solid var(--next);padding:10px 16px 14px;display:none;flex-direction:column;gap:8px;z-index:50;box-shadow:0 -4px 20px rgba(0,0,0,0.15)}
.test-bar.visible{display:flex}
.test-bar-row{display:flex;align-items:center;gap:6px}
.test-bar label{font-size:10px;font-weight:800;letter-spacing:3px;color:var(--next);text-transform:uppercase;flex-shrink:0}
.test-bar input[type=datetime-local]{flex:1;font-family:var(--mono);font-size:14px;padding:6px 10px;border:1.5px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);min-width:0}
.test-jump-btns{display:flex;gap:5px;flex-wrap:wrap}
.tjb{font-family:var(--font);font-size:13px;font-weight:800;padding:6px 10px;border-radius:6px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;-webkit-tap-highlight-color:transparent;flex:1;min-width:48px;text-align:center}
.tjb.neg{color:var(--active);border-color:var(--active)}
.tjb.pos{color:var(--next);border-color:var(--next)}
.tjb.act{background:var(--next);color:#fff;border-color:var(--next)}
.tjb:active{opacity:.7}
.test-bar-actions{display:flex;gap:6px}
.test-bar-actions button{font-family:var(--font);font-size:13px;font-weight:800;letter-spacing:1px;padding:7px 16px;border-radius:6px;border:none;cursor:pointer;flex:1}
.tbtn-set{background:var(--next);color:#fff}
.tbtn-off{background:var(--bg);color:var(--sub);border:1.5px solid var(--border)}
.test-active-badge{display:none;font-size:10px;font-weight:800;letter-spacing:2px;color:var(--next);background:var(--next-bg);border:1.5px solid var(--next);border-radius:4px;padding:2px 8px;text-transform:uppercase}
.test-active-badge.visible{display:inline-block}

/* ── BOOT SCREEN ── */
#bootScreen{position:fixed;inset:0;background:#080808;z-index:99999;display:flex;align-items:center;justify-content:center;overflow:hidden}
#bootScreen.hide{animation:curtainRip 0.45s cubic-bezier(0.9,0,1,1) forwards}
@keyframes curtainRip{0%{transform:translateX(0)}100%{transform:translateX(105%)}}
#bootBike{position:absolute;animation:bikeRide 2.6s cubic-bezier(0.25,0.46,0.45,0.94) forwards}
@keyframes bikeRide{0%{transform:translateX(-110vw);opacity:0}15%{opacity:1}38%{transform:translateX(0)}72%{transform:translateX(0)}82%{transform:translateX(20vw)}100%{transform:translateX(130vw)}}
#bootExhaust{position:absolute;display:flex;gap:8px;align-items:center;animation:exhaustLife 2.6s forwards}
@keyframes exhaustLife{0%,35%{opacity:0}45%{opacity:1}70%{opacity:1}82%{opacity:0}100%{opacity:0}}
.exhaust-puff{border-radius:50%;background:rgba(255,255,255,0.1);animation:puff 0.6s ease-out infinite}
.exhaust-puff:nth-child(1){width:8px;height:8px;animation-delay:0s}
.exhaust-puff:nth-child(2){width:14px;height:14px;animation-delay:0.15s}
.exhaust-puff:nth-child(3){width:22px;height:22px;animation-delay:0.3s}
@keyframes puff{0%{transform:scale(1);opacity:0.7}100%{transform:scale(2.2);opacity:0}}
#bootLines{position:absolute;inset:0;overflow:hidden;animation:linesLife 2.6s forwards}
@keyframes linesLife{0%,68%{opacity:0}76%{opacity:1}86%{opacity:1}100%{opacity:0}}
.speed-line{position:absolute;height:1px;background:linear-gradient(to right,transparent,rgba(220,30,30,0.7),transparent)}
#bootGlow{position:absolute;width:300px;height:80px;background:radial-gradient(ellipse,rgba(200,20,20,0.15) 0%,transparent 70%);animation:glowLife 2.6s forwards}
@keyframes glowLife{0%,35%{opacity:0}45%{opacity:1}70%{opacity:1}82%{opacity:0}100%{opacity:0}}
#bootTitle{position:absolute;bottom:28%;font-size:10px;letter-spacing:10px;color:rgba(255,255,255,0.2);text-transform:uppercase;animation:titleLife 2.6s forwards}
@keyframes titleLife{0%{opacity:0}15%{opacity:1}72%{opacity:1}100%{opacity:0}}
#bootFlash{position:absolute;inset:0;background:rgba(200,0,0,0.08);animation:flashLife 2.6s forwards;pointer-events:none}
@keyframes flashLife{0%,72%{opacity:0}78%{opacity:1}88%{opacity:0}100%{opacity:0}}

/* ── SERIES LOGO ── */
.clock-logo{display:flex;align-items:center;gap:10px;margin-top:6px;min-height:28px}
#seriesLogo{height:28px;max-width:140px;object-fit:contain;display:none}
#seriesBadge{font-size:11px;font-weight:800;letter-spacing:3px;color:var(--sub);text-transform:uppercase;padding:3px 10px;border:1.5px solid var(--border);border-radius:3px;display:none}

/* ── LANDSCAPE LAYOUT ── */
@media (orientation: landscape) {
  #app {
    flex-direction: row;
    height: 100%;
    overflow: hidden;
  }
  .left-panel {
    width: 42%;
    min-width: 260px;
    max-width: 400px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    border-right: 2px solid var(--border);
    overflow-y: auto;
    height: 100%;
  }
  /* Clock compacter in landscape */
  .clock-section {
    padding: 10px 16px 8px;
    flex-direction: column;
    gap: 2px;
  }
  #clockTime { font-size: clamp(36px, 8vw, 56px); }
  #clockSub  { font-size: clamp(10px, 2vw, 13px); }
  .clock-logo { margin-top: 4px; }
  #seriesLogo { height: 22px; }

  /* Current event in landscape */
  .current-section { padding: 10px 16px 8px; }
  #currentEventName { font-size: clamp(18px, 4vw, 28px); }
  #currentEventDetail { font-size: clamp(12px, 2.5vw, 15px); }

  /* Countdown fills remaining space in landscape */
  .countdown-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 10px 16px;
    text-align: center;
  }
  #countdownTime { font-size: clamp(48px, 12vw, 80px); }

  /* Schedule takes right side */
  .schedule-section {
    flex: 1;
    min-height: 0;
    height: 100%;
    border-left: none;
  }
  .schedule-header { padding: 8px 16px; }
  .sched-item { padding: 9px 16px; }
  #scheduleBody { height: calc(100% - 44px); }
}

/* Portrait: left-panel transparent (no structural effect) */
@media (orientation: portrait) {
  .left-panel { display: contents; }
}

/* ── HORN FLASH ── */
@keyframes hornFlash {
  0%   { background: var(--active); }
  100% { background: var(--surface); }
}
.horn-flash { animation: hornFlash 0.6s ease-out; }
.icon-btn.sound-off { opacity: 0.35; }
</style>
</head>
<body>

      <div id="clockTime">--:--:--</div>

      <div id="countdownLabel">VISSZASZÁMLÁLÓ</div>

      <span class="schedule-title">MENETREND</span>

</div>
<div class="top-bar">
  <div class="icon-btn" id="soundBtn" title="Hang">🔔</div>
  <div class="icon-btn" id="testBtn">🕹</div>
</div>
<div class="test-bar" id="testBar">
  <div class="test-bar-row">
    <label>🕹 TESZT IDŐ</label>
    <input type="datetime-local" id="testDateInput">
  </div>
  <div class="test-jump-btns">
    <div class="tjb neg" onclick="jumpTime(-60)">−1h</div>
    <div class="tjb neg" onclick="jumpTime(-15)">−15m</div>
    <div class="tjb neg" onclick="jumpTime(-5)">−5m</div>
    <div class="tjb neg" onclick="jumpTime(-1)">−1m</div>
    <div class="tjb pos" onclick="jumpTime(1)">+1m</div>
    <div class="tjb pos" onclick="jumpTime(5)">+5m</div>

    <div class="tjb pos" onclick="jumpTime(60)">+1h</div>
  </div>

    <button class="tbtn-set" onclick="activateTestMode()">▶ Beállít</button>
    <button class="tbtn-off" onclick="deactivateTestMode()">✕ Kikapcsol</button>
  </div>

<script>
const DAY_NAMES=['Vasárnap','Hétfő','Kedd','Szerda','Csütörtök','Péntek','Szombat'];
const MONTH_NAMES=['Jan','Feb','Már','Ápr','Máj','Jún','Júl','Aug','Szep','Okt','Nov','Dec'];
function pad(n){return String(n).padStart(2,'0')}
let processedSchedule=[];
let categoryLogos={};
const LOGO_MAP = {
  'MotoGP':     'https://porkolabjozsef-gif.github.io/RC_pwa/motogp.png',
  'Moto2':      'https://porkolabjozsef-gif.github.io/RC_pwa/moto2.png',
  'Moto3':      'https://porkolabjozsef-gif.github.io/RC_pwa/moto3.png',
  'WorldSBK':   'https://porkolabjozsef-gif.github.io/RC_pwa/worldsbk.png',
  'WorldSSP':   'https://porkolabjozsef-gif.github.io/RC_pwa/worldssp.png',
  'WorldSSP300':'https://porkolabjozsef-gif.github.io/RC_pwa/worldssp.png',
  'WorldWCR':   'https://porkolabjozsef-gif.github.io/RC_pwa/worldwcr.png',
  'WorldSPB':   'https://porkolabjozsef-gif.github.io/RC_pwa/worldspb.png',
  'R3':         'https://porkolabjozsef-gif.github.io/RC_pwa/r3.png',
  'Moto4NC':    'https://porkolabjozsef-gif.github.io/RC_pwa/moto4nc.png',
  'M4NC':       'https://porkolabjozsef-gif.github.io/RC_pwa/moto4nc.png',
};
let scheduleManuallyLoaded=false;
let testModeTime=null,testModeStartedAt=0;
const hornFired=new Set(),liveHornFired=new Set();
function getNow(){return testModeTime===null?new Date():new Date(testModeTime.getTime()+(Date.now()-testModeStartedAt))}
function parseEventDateTime(date,timeStr){
  if(!timeStr)return null;
  const p=timeStr.split(':').map(Number);
  const[y,mo,d]=date.split('-').map(Number);
  return new Date(y,mo-1,d,p[0]||0,p[1]||0,p[2]||0,0);
}
function loadNewSchedule(parsed){
  const raw=parsed.schedule.map((ev,i)=>({...ev,startDt:parseEventDateTime(ev.date,ev.start),endDt:ev.end?parseEventDateTime(ev.date,ev.end):null,idx:i}));
  raw.sort((a,b)=>(!a.startDt?1:!b.startDt?-1:a.startDt-b.startDt));
  for(let i=0;i<raw.length;i++){
    const ev=raw[i];
    if(ev.endDt||ev.type==='procedure')continue;
    for(let j=i+1;j<raw.length;j++){
      const nev=raw[j];
      if(!nev.startDt||nev.startDt<=ev.startDt)continue;
      if((nev.startDt-ev.startDt)>4*60*60*1000)break;
      ev.implicitEndDt=nev.startDt;break;
    }
  }
  raw.forEach((ev,i)=>{ev.idx=i});
  processedSchedule.length=0;
  raw.forEach(ev=>processedSchedule.push(ev));
  hornFired.clear();liveHornFired.clear();
  categoryLogos = parsed.categoryLogos || {};
  buildSchedule();updateDashboard();saveScheduleToStorage(parsed);
}
function findCurrentAndNext(now){
  let next=null,currentSession=null,currentProcedure=null;
  for(let ev of processedSchedule){
    if(!ev.startDt)continue;
    const started=now>=ev.startDt,isProcedure=ev.type==='procedure';
    const effectiveEnd=ev.endDt||ev.implicitEndDt||null;
    let ended;
    if(effectiveEnd){ended=now>=effectiveEnd}
    else if(isProcedure){ended=(now-ev.startDt)>60*1000}
    else if(ev.type==='race'||ev.type==='session'){
      let ns=null;
      for(let j=ev.idx+1;j<processedSchedule.length;j++){const nev=processedSchedule[j];if(nev.startDt&&nev.type!=='procedure'&&nev.startDt>ev.startDt){ns=nev.startDt;break}}
      ended=ns?now>=ns:(now-ev.startDt)>4*60*60*1000;
    } else {ended=(now-ev.startDt)>30*60*1000}
    if(!started){if(!next)next=ev;continue}
    if(ended)continue;
    if(isProcedure){if(!currentProcedure||ev.startDt>currentProcedure.startDt)currentProcedure=ev}
    else{if(!currentSession)currentSession=ev}
  }
  return{current:currentSession||currentProcedure||null,next};
}
function fmtCd(sec){
  if(sec<0)sec=0;
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  return h>0?`${h}:${pad(m)}:${pad(s)}`:`${m}:${pad(s)}`;
}
function updateClock(){
  const now=getNow();
  document.getElementById('clockTime').textContent=pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());
  document.getElementById('clockSub').textContent=DAY_NAMES[now.getDay()].toUpperCase()+' '+now.getDate()+' '+MONTH_NAMES[now.getMonth()]+' '+now.getFullYear()+(testModeTime?' — TEST':' — CET');
  document.getElementById('clockTime').classList.toggle('test-mode',testModeTime!==null);
}
function updateDashboard(){
  const now=getNow();
  const{current,next}=findCurrentAndNext(now);
  const section=document.getElementById('currentSection');
  const labelEl=document.getElementById('currentLabel');
  const nameEl=document.getElementById('currentEventName');
  const detailEl=document.getElementById('currentEventDetail');
  const cdTime=document.getElementById('countdownTime');
  const cdLabel=document.getElementById('countdownLabel');
  const cdCtx=document.getElementById('countdownCtx');
  if(current){
    section.className='current-section active';
    labelEl.textContent='JELENLEG';
    nameEl.textContent=current.name;
    const end=current.endDt||current.implicitEndDt;
    if(end){
      const durMin=Math.round((end-current.startDt)/60000);
      detailEl.textContent=current.start+(current.end?' – '+current.end:'')+' · '+durMin+' perc';
      const rem=Math.max(0,Math.floor((end-now)/1000));
      cdTime.textContent=fmtCd(rem);cdTime.className='running';
      cdLabel.textContent='HÁTRALÉVŐ IDŐ';
    } else {
      detailEl.textContent=current.start;
      cdTime.textContent=fmtCd(Math.floor((now-current.startDt)/1000));cdTime.className='';
      cdLabel.textContent='ELTELT IDŐ';
    }
    cdCtx.textContent=current.name.toUpperCase();
  } else if(next){
    section.className='current-section next-only';
    labelEl.textContent='KÖVETKEZŐ';
    nameEl.textContent=next.name;
    const[,mo,d]=next.date.split('-').map(Number);
    detailEl.textContent=next.start+' · '+MONTH_NAMES[mo-1]+' '+d;
    const rem=Math.max(0,Math.floor((next.startDt-now)/1000));
    cdTime.textContent=fmtCd(rem);cdTime.className='waiting';
    cdLabel.textContent='KÖVETKEZŐ ESEMÉNYIG';
    cdCtx.textContent=next.name.toUpperCase();
  } else {
    section.className='current-section';
    labelEl.textContent='JELENLEG';
    nameEl.textContent=processedSchedule.length>0?'Minden esemény véget ért':'Nincs betöltött menetrend';
    detailEl.textContent=processedSchedule.length>0?'':'Töltsd be a JSON fájlt';
    cdTime.textContent='--:--';cdTime.className='';
    cdLabel.textContent='VISSZASZÁMLÁLÓ';cdCtx.textContent='—';
  }
  updateSeriesLogo(current,next);
}
function updateSeriesLogo(current,next){
  const cat=(current&&current.category)||(next&&next.category)||null;
  const logoEl=document.getElementById('seriesLogo');
  const badgeEl=document.getElementById('seriesBadge');
  if(!cat){logoEl.style.display='none';badgeEl.style.display='none';return}
  // LOGO_MAP elsőbbsége, utána JSON categoryLogos
  const logoUrl=LOGO_MAP[cat]||(categoryLogos&&categoryLogos[cat])||null;
  if(logoUrl){
    logoEl.src=logoUrl;
    logoEl.style.display='block';
    logoEl.style.height='32px';
    badgeEl.style.display='none';
  } else {
    logoEl.style.display='none';
    badgeEl.textContent=cat;
    badgeEl.style.display='inline-block';
  }
}
function buildSchedule(){
  const now=getNow();
  const body=document.getElementById('scheduleBody');
  const badge=document.getElementById('scheduleCount');
  const{current,next}=findCurrentAndNext(now);
  const groups={};let count=0;
  for(let ev of processedSchedule){
    if(!ev.startDt)continue;
    const end=ev.endDt||ev.implicitEndDt;
    let isPast=end?now>end:ev.type==='procedure'?(now-ev.startDt)>60*1000:(now-ev.startDt)>30*60*1000;
    if(isPast)continue;
    if(!groups[ev.date])groups[ev.date]=[];
    groups[ev.date].push(ev);count++;
  }
  if(badge)badge.textContent=count>0?count+' esemény':'';
  if(count===0){body.innerHTML=processedSchedule.length>0?'<div class="empty-msg">✅ Minden esemény véget ért</div>':'<div class="empty-msg">Töltsd be az időtervet (JSON)</div>';return}
  let html='';
  for(let date of Object.keys(groups).sort()){
    const[y,mo,d]=date.split('-').map(Number);
    const dt=new Date(y,mo-1,d);
    html+=`<div class="day-header"><span class="day-name">${DAY_NAMES[dt.getDay()].toUpperCase()}</span><span class="day-date">${d} ${MONTH_NAMES[mo-1].toUpperCase()} ${y}</span><div class="day-line"></div></div>`;
    for(let ev of groups[date]){
      const isCurrent=current&&current.idx===ev.idx;
      const isNext=!isCurrent&&next&&next.idx===ev.idx;
      const tc=ev.type==='race'?'t-race':ev.type==='session'?'t-session':ev.type==='marshal'?'t-marshal':ev.type==='procedure'?'t-procedure':'';
      const sc=isCurrent?'is-current':isNext?'is-next':'';
      const cat=ev.category?`<span class="sched-cat">${ev.category}</span>`:'';
      html+=`<div class="sched-item ${tc} ${sc}"><div class="sched-dot"></div><div class="sched-time">${ev.start}</div><div class="sched-name">${ev.name}</div>${cat}</div>`;
    }
  }
  body.innerHTML=html;
}
document.getElementById('jsonFile').addEventListener('change',function(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(evt){
    try{
      const parsed=JSON.parse(evt.target.result);
      if(!parsed.schedule||!Array.isArray(parsed.schedule)){alert('Érvénytelen JSON');return}
      scheduleManuallyLoaded=true;loadNewSchedule(parsed);
    }catch(err){alert('JSON hiba: '+err.message)}
  };
  reader.readAsText(file);this.value='';
});

testBtn.addEventListener('click',()=>{

  document.getElementById('clockTime').classList.add('test-mode');

  document.getElementById('testBadge').classList.remove('visible');

function jumpTime(minutes){
  if(!testModeTime){
    // Ha nincs teszt mód, az aktuális időből indul
    testModeTime=new Date();testModeStartedAt=Date.now();hornFired.clear();
    document.getElementById('clockTime').classList.add('test-mode');
    document.getElementById('testBadge').classList.add('visible');
  }
  // Offset: mennyi idő telt el a testModeStartedAt óta
  const elapsed=Date.now()-testModeStartedAt;
  testModeTime=new Date(testModeTime.getTime()+elapsed+minutes*60000);
  testModeStartedAt=Date.now();
  // Update input field
  const t=testModeTime;
  const pad2=n=>String(n).padStart(2,'0');
  document.getElementById('testDateInput').value=
    t.getFullYear()+'-'+pad2(t.getMonth()+1)+'-'+pad2(t.getDate())+'T'+pad2(t.getHours())+':'+pad2(t.getMinutes());
}
const RC_KEY='rc_schedule_v1';
function saveScheduleToStorage(parsed){
  if(!parsed?.schedule?.length)return;
  let lastDate='';for(const ev of parsed.schedule){if(ev.date>lastDate)lastDate=ev.date}
  if(!lastDate)return;
  const[y,mo,d]=lastDate.split('-').map(Number);
  const expires=new Date(y,mo-1,d,23,59,59).getTime();
  try{localStorage.setItem(RC_KEY,JSON.stringify({parsed,expires}))}catch(e){}
}
function loadScheduleFromStorage(){
  try{
    const raw=localStorage.getItem(RC_KEY);if(!raw)return null;
    const data=JSON.parse(raw);if(!data?.parsed||!data?.expires)return null;
    if(Date.now()>data.expires){localStorage.removeItem(RC_KEY);return null}
    return data.parsed;
  }catch(e){return null}
}
async function requestWakeLock(){try{if('wakeLock' in navigator)await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')requestWakeLock()});
requestWakeLock();
const stored=loadScheduleFromStorage();
if(stored){scheduleManuallyLoaded=true;loadNewSchedule(stored)}
updateClock();updateDashboard();buildSchedule();
setInterval(updateClock,1000);setInterval(updateDashboard,1000);setInterval(buildSchedule,1000);

// SOUND ENGINE
// ============================================================
let audioCtx = null;
// Default: KI — csak explicit bekapcsoláskor szól
let soundEnabled = localStorage.getItem('rc_sound') === '1';

function doPlayHorn(ctx) {
  const t = ctx.currentTime;

  // Kompresszor — maximális észlelt hangerő
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -6;
  comp.knee.value      = 0;
  comp.ratio.value     = 20;
  comp.attack.value    = 0.001;
  comp.release.value   = 0.1;
  comp.connect(ctx.destination);

  // Torzító waveshaper — "dirt" ami átvágja a motorzajt
  const shaper = ctx.createWaveShaper();
  const N = 512, curve = new Float32Array(N);
  const k = 80; // torzítás erőssége
  for (let i = 0; i < N; i++) {
    const x = (i * 2) / N - 1;
    curve[i] = (Math.PI + k) * x / (Math.PI + k * Math.abs(x));
  }
  shaper.curve = curve;
  shaper.oversample = '4x';
  shaper.connect(comp);

  // Master envelope — gyors attack (15ms), teljes sustain, gyors decay
  const master = ctx.createGain();
  // Szimmetrikus envelope: 15ms attack = 15ms decay
  master.gain.setValueAtTime(0.001, t);
  master.gain.linearRampToValueAtTime(0.9, t + 0.015);
  master.gain.setValueAtTime(0.9,           t + 1.235);
  master.gain.linearRampToValueAtTime(0.001, t + 1.25);
  master.connect(shaper);

  // Négyszög hullám: max felharmonikusok, átüt a motorzajon
  // 520Hz alap + 780Hz kvint → klasszikus ipari kürt hangzás
  [[520, 0.65], [780, 0.35]].forEach(([freq, vol]) => {
    const osc = ctx.createOscillator();
    const g   = ctx.createGain();
    osc.type  = 'square';
    osc.frequency.setValueAtTime(freq, t);
    g.gain.value = vol;
    osc.connect(g);
    g.connect(master);
    osc.start(t);
    osc.stop(t + 1.26);
  });

  // Vizuális flash
  const sec = document.getElementById('currentSection');
  sec.classList.remove('horn-flash');
  void sec.offsetWidth;
  sec.classList.add('horn-flash');
  setTimeout(() => sec.classList.remove('horn-flash'), 700);
}

// Csak timer-ből hívva (nem user gesture)
function playHorn() {
  if (!soundEnabled || !audioCtx) return;
  if (audioCtx.state === 'suspended') {
    audioCtx.resume().then(() => doPlayHorn(audioCtx)).catch(() => {});
  } else {
    doPlayHorn(audioCtx);
  }
}

// Sound gomb — AudioContext létrehozása USER GESTURE-N BELÜL
const soundBtn = document.getElementById('soundBtn');
function applySound() {
  soundBtn.textContent = soundEnabled ? '🔔' : '🔕';
  soundBtn.classList.toggle('sound-off', !soundEnabled);
}
applySound();

soundBtn.addEventListener('click', function() {
  soundEnabled = !soundEnabled;
  localStorage.setItem('rc_sound', soundEnabled ? '1' : '0');
  applySound();

  if (soundEnabled) {
    // AudioContext létrehozása/feloldása a gesztuson belül
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e) { soundEnabled = false; applySound(); return; }
    }
    const play = () => doPlayHorn(audioCtx);
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().then(play).catch(() => {});
    } else {
      play();
    }
  }
});

// ============================================================
// HORN EVENT CHECKER — minden másodpercben
// ============================================================
const hornFiredLive = new Set();

function checkHornEvents() {
  if (!soundEnabled) return;
  const now = getNow();
  const ms  = now.getTime();

  for (const ev of processedSchedule) {
    if (!ev.horn || !ev.startDt) continue;
    const diff = ms - ev.startDt.getTime();
    if (diff >= 0 && diff < 2000 && !hornFiredLive.has(ev.idx)) {
      hornFiredLive.add(ev.idx);
      playHorn();
    }
  }
}

setInterval(checkHornEvents, 500);

if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js').catch(()=>{});
</script>
